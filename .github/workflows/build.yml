name: Build JAR
on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
    
    - name: Import GPG key
      if: github.event_name == 'release'
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        gpg --list-secret-keys --keyid-format LONG
    
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
        fi
    
    - name: Compile
      run: |
        mkdir -p bin
        find src -name "*.java" | xargs javac -d bin
    
    - name: Create JAR
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        echo "Manifest-Version: 1.0" > MANIFEST.MF
        echo "Main-Class: be.stef.rar.Unrar5j" >> MANIFEST.MF
        echo "Implementation-Version: ${VERSION}" >> MANIFEST.MF
        echo "" >> MANIFEST.MF
        jar cfm unrar5j-${VERSION}.jar MANIFEST.MF -C bin .
    
    - name: Create sources JAR
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        jar cf unrar5j-${VERSION}-sources.jar -C src .
    
    - name: Create javadoc JAR
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        mkdir -p javadoc
        find src -name "*.java" | xargs javadoc -d javadoc -quiet 2>/dev/null || true
        jar cf unrar5j-${VERSION}-javadoc.jar -C javadoc .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: unrar5j-${{ steps.version.outputs.VERSION }}
        path: unrar5j-${{ steps.version.outputs.VERSION }}.jar
    
    - name: Upload to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          unrar5j-${{ steps.version.outputs.VERSION }}.jar
          unrar5j-${{ steps.version.outputs.VERSION }}-sources.jar
          unrar5j-${{ steps.version.outputs.VERSION }}-javadoc.jar
    
    - name: Set pom version
      if: github.event_name == 'release'
      run: sed -i 's|\${project.version}|${{ steps.version.outputs.VERSION }}|g' pom.xml
    
    - name: Sign and publish to Maven Central
      if: github.event_name == 'release'
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        DIR=io/github/realburst/unrar5j/${VERSION}
        mkdir -p ${DIR}

        # Copier les fichiers dans la structure de répertoire
        cp unrar5j-${VERSION}.jar ${DIR}/
        cp unrar5j-${VERSION}-sources.jar ${DIR}/
        cp unrar5j-${VERSION}-javadoc.jar ${DIR}/
        cp pom.xml ${DIR}/unrar5j-${VERSION}.pom

        # Signer tous les fichiers
        gpg --batch --yes --local-user 9D24A99E30F4B198 --armor --detach-sign ${DIR}/unrar5j-${VERSION}.jar
        gpg --batch --yes --local-user 9D24A99E30F4B198 --armor --detach-sign ${DIR}/unrar5j-${VERSION}-sources.jar
        gpg --batch --yes --local-user 9D24A99E30F4B198 --armor --detach-sign ${DIR}/unrar5j-${VERSION}-javadoc.jar
        gpg --batch --yes --local-user 9D24A99E30F4B198 --armor --detach-sign ${DIR}/unrar5j-${VERSION}.pom

        # Générer les checksums MD5 et SHA1
        for f in ${DIR}/unrar5j-${VERSION}.jar ${DIR}/unrar5j-${VERSION}-sources.jar ${DIR}/unrar5j-${VERSION}-javadoc.jar ${DIR}/unrar5j-${VERSION}.pom; do
          md5sum $f | awk '{print $1}' > ${f}.md5
          sha1sum $f | awk '{print $1}' > ${f}.sha1
        done

        # Créer le bundle zip avec la structure de répertoire
        zip -r bundle.zip io/

        # Uploader via API Central Portal
        curl --fail --request POST \
          --header "Authorization: Bearer $(echo -n '${{ secrets.CENTRAL_USERNAME }}:${{ secrets.CENTRAL_PASSWORD }}' | base64 -w 0)" \
          --form bundle=@bundle.zip \
          https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}