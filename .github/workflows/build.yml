name: Build JAR
on:
  push:
    branches: [ main ]
  release:
    types: [ created ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        server-id: central
        server-username: CENTRAL_USERNAME
        server-password: CENTRAL_PASSWORD
    
    - name: Import GPG key
      if: github.event_name == 'release'
      run: |
        echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        gpg --list-secret-keys --keyid-format LONG
    
    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "release" ]; then
          echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
        fi
    
    - name: Compile
      run: |
        mkdir -p bin
        find src -name "*.java" | xargs javac -d bin
    
    - name: Create JAR
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        echo "Manifest-Version: 1.0" > MANIFEST.MF
        echo "Main-Class: be.stef.rar.Unrar5j" >> MANIFEST.MF
        echo "Implementation-Version: ${VERSION}" >> MANIFEST.MF
        echo "" >> MANIFEST.MF
        jar cfm unrar5j-${VERSION}.jar MANIFEST.MF -C bin .
    
    - name: Create sources JAR
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        jar cf unrar5j-${VERSION}-sources.jar -C src .
    
    - name: Create javadoc JAR
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        mkdir -p javadoc
        find src -name "*.java" | xargs javadoc -d javadoc -quiet 2>/dev/null || true
        jar cf unrar5j-${VERSION}-javadoc.jar -C javadoc .
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: unrar5j-${{ steps.version.outputs.VERSION }}
        path: unrar5j-${{ steps.version.outputs.VERSION }}.jar
    
    - name: Upload to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          unrar5j-${{ steps.version.outputs.VERSION }}.jar
          unrar5j-${{ steps.version.outputs.VERSION }}-sources.jar
          unrar5j-${{ steps.version.outputs.VERSION }}-javadoc.jar
    
    - name: Set pom version
      if: github.event_name == 'release'
      run: sed -i 's|\${project.version}|${{ steps.version.outputs.VERSION }}|g' pom.xml
    
    - name: Sign and publish to Maven Central
      if: github.event_name == 'release'
      run: |
        VERSION=${{ steps.version.outputs.VERSION }}
        mvn --batch-mode gpg:sign-and-deploy-file \
          -Dgpg.keyname=9D24A99E30F4B198 \
          -Dfile=unrar5j-${VERSION}.jar \
          -Dsources=unrar5j-${VERSION}-sources.jar \
          -Djavadoc=unrar5j-${VERSION}-javadoc.jar \
          -DpomFile=pom.xml \
          -DrepositoryId=central \
          -Durl=https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/
      env:
        CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
        CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}